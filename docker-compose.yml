
services:
  # ==========================================
  # 1. 稽核日誌資料庫 (Elasticsearch)
  # ==========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: tsmc-elasticsearch
    hostname: tsmc-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - network.host=0.0.0.0
      - http.host=0.0.0.0
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
  # ==========================================
  # 1. 後端服務 (NestJS Backend) - 直連 Neon
  # ==========================================
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: tsmc-backend
  #   ports:
  #     - "4000:4000"
  #   env_file:
  #     - ./backend/.env
  #   restart: always
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tsmc-backend
    ports:
      - "4000:4000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    # 使用 env_file 動態載入，取代 environment 的明文硬編碼
    env_file:
      - ./backend/.env
    restart: always
  # ==========================================
  # 2. 前端服務 (Next.js Frontend)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
    container_name: tsmc-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  elasticsearch_data: