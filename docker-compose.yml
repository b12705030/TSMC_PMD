
services:
  # ==========================================
  # 1. 後端服務 (NestJS Backend) - 直連 Neon
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tsmc-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: always
  # ==========================================
  # 2. 前端服務 (Next.js Frontend)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
    container_name: tsmc-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
