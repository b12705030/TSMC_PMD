services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: pms_e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d pms_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://e2e:e2e@postgres-e2e:5432/pms_e2e?schema=public
      DIRECT_URL: postgresql://e2e:e2e@postgres-e2e:5432/pms_e2e?schema=public
      NODE_ENV: development
      FRONTEND_URL: "http://localhost:3000"
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres-e2e:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/main.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  frontend-e2e:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
